<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Equations Animation</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- MathJax for LaTeX rendering -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .axis-line { stroke: #334155; stroke-width: 1.5px; }
        .grid-line { stroke: #e2e8f0; stroke-width: 1px; }
        .point { cursor: grab; }
        .point:active { cursor: grabbing; }
        .input-error { border-color: #ef4444 !important; background-color: #fef2f2 !important; color: #b91c1c; }
        .input-success { border-color: #10b981 !important; background-color: #ecfdf5 !important; color: #047857; }
        
        /* Modal Overlay */
        #name-modal {
            background-color: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10 relative">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-xl">
                L
            </div>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">Linear Equations</h1>
        </div>
        
        <!-- Mode Switcher -->
        <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
            <button id="btn-mode-explorer" onclick="switchMode('explorer')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white shadow-sm text-blue-600">Explorer</button>
            <button id="btn-mode-quiz" onclick="switchMode('quiz')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 hover:text-slate-800">Quiz Mode</button>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-6 lg:p-8 flex items-start justify-center">
        <div class="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
            
            <!-- LEFT COLUMN: Controls & Table -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                
                <!-- Stats / Score Header (Quiz Mode Only) -->
                <div id="quiz-stats" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Student</p>
                        <p id="student-name-display" class="font-semibold text-slate-800">Name</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Score</p>
                        <p class="font-bold text-lg text-blue-600"><span id="score-correct">0</span> / <span id="score-attempted">0</span></p>
                    </div>
                </div>

                <!-- Equation & Instructions Card -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start mb-6 gap-4">
                        <div>
                            <h2 class="text-lg font-bold mb-1" id="panel-title">Explore Linear Equations</h2>
                            <p class="text-sm text-slate-600" id="panel-desc">Follow the steps to see how an equation becomes a line on the graph.</p>
                        </div>
                        <button id="btn-random-explorer" onclick="shuffleExplorerEquation()" class="text-sm flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-medium rounded-lg transition-colors border border-indigo-200 shadow-sm whitespace-nowrap">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                            <span class="hidden sm:inline">New Equation</span>
                        </button>
                    </div>
                    
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-6 mb-6 flex justify-center items-center">
                        <div id="equation-display" class="text-2xl text-blue-900 font-medium"></div>
                    </div>

                    <!-- Explorer Mode Steps -->
                    <div id="explorer-controls" class="flex justify-between items-center">
                        <button id="btn-prev-step" onclick="prevStep()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-medium transition-colors shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                            &larr; Prev
                        </button>
                        <div class="text-sm font-medium text-slate-500 mx-4">Step <span id="step-indicator">1</span> of 3</div>
                        <button id="btn-next-step" onclick="nextStep()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                            Next &rarr;
                        </button>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-4">Coordinates Table</h3>
                    <div class="overflow-hidden rounded-lg border border-slate-200">
                        <table class="w-full text-center text-sm">
                            <tbody id="table-body" class="divide-y divide-slate-200">
                                <!-- Table rows injected by JS -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Quiz Submit Button -->
                    <button id="btn-submit-quiz" onclick="submitQuiz()" class="hidden w-full mt-6 px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold transition-all shadow-sm block">
                        Submit Answer
                    </button>

                    <!-- Calculations (Explorer Step 2) -->
                    <div id="calculation-container" class="hidden mt-6 bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                        <h4 class="text-sm font-bold text-slate-700 mb-3">Calculations:</h4>
                        <ul id="calculation-list" class="space-y-2 text-sm text-slate-700 font-medium">
                            <!-- Injected by JS -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Graph Container -->
            <div class="lg:col-span-7 bg-white p-2 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center min-h-[400px]">
                <div id="graph-container" class="w-full max-w-[600px] aspect-square relative touch-none">
                    <!-- D3 SVG will be appended here -->
                </div>
                <p id="graph-hint" class="mt-4 text-sm text-slate-500 font-medium h-5 text-center">Click the graph to plot points.</p>
            </div>
            
        </div>
    </main>

    <!-- Name Input Modal (Quiz Mode) -->
    <div id="name-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 transform transition-all scale-100 opacity-100">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 mx-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-center text-slate-800 mb-2">Welcome to Quiz Mode</h3>
            <p class="text-center text-slate-500 text-sm mb-6">Enter your name to start tracking your score.</p>
            
            <input type="text" id="input-student-name" placeholder="Your Name" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow text-center text-lg font-medium mb-6" autocomplete="off">
            
            <button onclick="startQuizFromNameModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                Start Quiz
            </button>
        </div>
    </div>

    <script>
        // --- GOOGLE APPS SCRIPT URL ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwu7AL9DcxjFiyr2vZUU8vTD_fS1NRXArB5S4DLmrOlsm2D1x7VYVJDJrJXK-t4KK-v/exec"; 

        // --- GLOBAL STATE ---
        let currentMode = 'explorer'; // 'explorer' or 'quiz'
        let currentStep = 1; // 1: Eq, 2: Table, 3: Graph
        let eq = {a: 2, b: -1, c: 0}; // Initial standard equation form: ax + by + c = 0
        let tableData = []; // Data for table rows
        let explorerTimeouts = []; // Tracks staggered animations so they can be canceled when navigating back
        
        // Quiz State
        let quizState = { name: '', correct: 0, attempted: 0, isSubmitted: false };
        let quizPoints = []; // Stores user-plotted coordinates {x, y, id}
        let quizTargetTable = []; // The generated correct data for the quiz
        
        // Graph settings
        const margin = {top: 30, right: 30, bottom: 30, left: 30};
        let width, height;
        let svg, g, xScale, yScale;
        let pointsGroup, lineGroup, dynamicLineGroup, uiGroup;

        // --- UTILS ---
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function formatLatexEq(a, b, c, inline = false) {
            // ax + by + c = 0 => y = mx + c_y
            // For simplicity, we mostly ensure b = -1 so it's y = ax + c
            let rightSide = "";
            let m = -a / b;
            let cy = -c / b;

            if (m === 0) {
                rightSide = cy.toString();
            } else {
                if (m === 1) rightSide += "x";
                else if (m === -1) rightSide += "-x";
                else rightSide += m + "x";

                if (cy > 0) rightSide += " + " + cy;
                else if (cy < 0) rightSide += " - " + Math.abs(cy);
            }
            return inline ? `\\(y = ${rightSide}\\)` : `$$y = ${rightSide}$$`;
        }

        function getCalculationString(a, b, c, x, y) {
            let m = -a / b;
            let cy = -c / b;
            let term1 = "";
            
            if (m === 1) term1 = `(${x})`;
            else if (m === -1) term1 = `-(${x})`;
            else if (m !== 0) term1 = `${m}(${x})`;
            else term1 = `0`;

            let term2 = "";
            if (cy > 0) term2 = ` + ${cy}`;
            else if (cy < 0) term2 = ` - ${Math.abs(cy)}`;

            return `\\( y = ${term1}${term2} = ${y} \\)`;
        }

        // --- INITIALIZATION ---
        function init() {
            initGraph();
            window.addEventListener('resize', () => {
                d3.select("#graph-container").selectAll("*").remove();
                initGraph();
                renderMode();
            });
            
            // Name input enter key support
            document.getElementById('input-student-name').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') startQuizFromNameModal();
            });

            generateEquation('explorer');
            renderMode();
        }

        // --- STREAMING_CHUNK:Google Apps Script Data Sync ---
        function sendDataToGAS() {
            if (!quizState.name || !GAS_URL || GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") return;
            
            const payload = {
                name: quizState.name,
                correct: quizState.correct,
                attempted: quizState.attempted,
                timestamp: new Date().toLocaleString()
            };

            // Send via POST using text/plain to avoid CORS preflight failures
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Error saving data:", err));
        }

        // --- STREAMING_CHUNK:Graph Setup (D3) ---
        function initGraph() {
            const container = document.getElementById('graph-container');
            const rect = container.getBoundingClientRect();
            width = rect.width - margin.left - margin.right;
            height = rect.height - margin.top - margin.bottom;

            xScale = d3.scaleLinear().domain([-10, 10]).range([0, width]);
            yScale = d3.scaleLinear().domain([-10, 10]).range([height, 0]);

            svg = d3.select("#graph-container")
                .append("svg")
                .attr("width", rect.width)
                .attr("height", rect.height)
                .style("touch-action", "none");

            // Define arrowheads for ONLY positive directions
            svg.append("defs").html(`
                <marker id="arrow-pos-x" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="0">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
                </marker>
                <marker id="arrow-pos-y" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="-90">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
                </marker>
            `);

            g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

            // Background rect for click events
            g.append("rect")
                .attr("width", width)
                .attr("height", height)
                .attr("fill", "transparent")
                .on("click", handleGraphClick);

            // Grid Lines
            g.append("g").attr("class", "grid")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(xScale).ticks(20).tickSize(-height).tickFormat(""));
            g.append("g").attr("class", "grid")
                .call(d3.axisLeft(yScale).ticks(20).tickSize(-width).tickFormat(""));
            g.selectAll(".grid line").attr("class", "grid-line");
            g.selectAll(".grid path").style("display", "none");

            // Custom Axis Lines with positive end arrows
            g.append("line").attr("class", "axis-line")
                .attr("x1", 0).attr("y1", yScale(0))
                .attr("x2", width).attr("y2", yScale(0))
                .attr("marker-end", "url(#arrow-pos-x)");
            
            g.append("line").attr("class", "axis-line")
                .attr("x1", xScale(0)).attr("y1", height)
                .attr("x2", xScale(0)).attr("y2", 0)
                .attr("marker-end", "url(#arrow-pos-y)");

            // Axis ticks and labels (hide the main domain path)
            g.append("g").attr("transform", `translate(0,${yScale(0)})`)
                .call(d3.axisBottom(xScale).ticks(10))
                .select(".domain").remove();
            g.append("g").attr("transform", `translate(${xScale(0)},0)`)
                .call(d3.axisLeft(yScale).ticks(10))
                .select(".domain").remove();
                
            // Move origin label slightly so it doesn't overlap lines
            g.selectAll(".tick text")
                .filter(d => d === 0).remove(); // Remove standard 0s
            g.append("text").attr("x", xScale(0) - 12).attr("y", yScale(0) + 16).text("0").attr("font-size", "10px").attr("fill", "#64748b");

            // Layer Groups
            dynamicLineGroup = g.append("g").attr("id", "dynamic-line-layer");
            lineGroup = g.append("g").attr("id", "line-layer");
            pointsGroup = g.append("g").attr("id", "points-layer");
            uiGroup = g.append("g").attr("id", "ui-layer"); // For feedback like red rings
        }

        // --- STREAMING_CHUNK:Mode & Logic Handlers ---
        function switchMode(mode) {
            currentMode = mode;
            
            // UI Button styling
            document.getElementById('btn-mode-explorer').className = mode === 'explorer' 
                ? "px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white shadow-sm text-blue-600" 
                : "px-4 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 hover:text-slate-800";
            document.getElementById('btn-mode-quiz').className = mode === 'quiz' 
                ? "px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white shadow-sm text-blue-600" 
                : "px-4 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 hover:text-slate-800";

            if (mode === 'quiz') {
                document.getElementById('explorer-controls').classList.add('hidden');
                document.getElementById('btn-submit-quiz').classList.remove('hidden');
                document.getElementById('quiz-stats').classList.remove('hidden');
                
                if (!quizState.name) {
                    showNameModal();
                } else {
                    startQuiz();
                }
            } else {
                document.getElementById('explorer-controls').classList.remove('hidden');
                document.getElementById('btn-submit-quiz').classList.add('hidden');
                document.getElementById('quiz-stats').classList.add('hidden');
                currentStep = 1;
                generateEquation('explorer');
                renderMode();
            }
        }

        function showNameModal() {
            const modal = document.getElementById('name-modal');
            modal.classList.remove('hidden');
            setTimeout(() => document.getElementById('input-student-name').focus(), 100);
        }

        function startQuizFromNameModal() {
            const name = document.getElementById('input-student-name').value.trim();
            if (name) {
                quizState.name = name;
                document.getElementById('student-name-display').innerText = name;
                document.getElementById('name-modal').classList.add('hidden');
                startQuiz();
            }
        }

        function generateEquation(mode) {
            if (mode === 'explorer') {
                eq = {a: 2, b: -1, c: 0}; // Simple start
                tableData = [-2, 0, 2].map(x => ({ x: x, y: 2*x, visible: false }));
            } else if (mode === 'quiz') {
                // Generate random equation avoiding horizontal/vertical lines
                do {
                    eq.a = getRandomInt(-3, 3);
                } while (eq.a === 0);
                
                eq.b = getRandomInt(-2, 2) >= 0 ? 1 : -1;
                eq.c = getRandomInt(-6, 6);
                
                let m = -eq.a / eq.b;
                let cy = -eq.c / eq.b;

                // Pick 3 integer x values that stay mostly within bounds
                let startX = getRandomInt(-4, 0);
                let stepX = getRandomInt(1, 3);
                
                quizTargetTable = [];
                for (let i=0; i<3; i++) {
                    let x = startX + (i*stepX);
                    let y = m * x + cy;
                    quizTargetTable.push({x: x, y: y});
                }
                
                // Set up inputs: 0 is full, 1 missing Y, 2 missing X
                tableData = [
                    { x: quizTargetTable[0].x, y: quizTargetTable[0].y, type: 'full' },
                    { x: quizTargetTable[1].x, y: null, targetY: quizTargetTable[1].y, type: 'miss_y' },
                    { x: null, targetX: quizTargetTable[2].x, y: quizTargetTable[2].y, type: 'miss_x' }
                ];
            }
        }

        function shuffleExplorerEquation() {
            // Generate random equation avoiding horizontal/vertical lines
            do {
                eq.a = getRandomInt(-3, 3);
            } while (eq.a === 0);
            
            eq.b = getRandomInt(-2, 2) >= 0 ? 1 : -1;
            eq.c = getRandomInt(-5, 5);
            
            let m = -eq.a / eq.b;
            let cy = -eq.c / eq.b;

            // Pick 3 integer x values that stay mostly within bounds
            let startX = getRandomInt(-4, 0);
            let stepX = getRandomInt(1, 3);
            
            tableData = [];
            for (let i=0; i<3; i++) {
                let x = startX + (i*stepX);
                let y = m * x + cy;
                tableData.push({x: x, y: y, visible: false});
            }
            
            currentStep = 1; // Reset to the first step
            renderMode();
        }

        // --- STREAMING_CHUNK:View Rendering ---
        function renderMode() {
            // Update Equation
            const eqDiv = document.getElementById('equation-display');
            eqDiv.innerHTML = formatLatexEq(eq.a, eq.b, eq.c);
            if (window.MathJax) MathJax.typesetPromise([eqDiv]);

            // Clear Graph Layers
            pointsGroup.selectAll("*").remove();
            lineGroup.selectAll("*").remove();
            dynamicLineGroup.selectAll("*").remove();
            uiGroup.selectAll("*").remove();
            
            if (currentMode === 'explorer') {
                document.getElementById('panel-title').innerText = "Explore Linear Equations";
                document.getElementById('panel-desc').innerText = "Follow the steps to see how an equation becomes a line.";
                document.getElementById('graph-hint').innerText = "Observe the graph updates.";
                document.getElementById('btn-random-explorer').classList.remove('hidden');
                updateStep();
            } else {
                document.getElementById('panel-title').innerText = "Quiz Mode";
                document.getElementById('panel-desc').innerText = "1. Fill the table.\n2. Plot 3 points (Click & Drag).\n3. Submit answer.";
                document.getElementById('graph-hint').innerText = "Click to add points. Drag to move them.";
                document.getElementById('calculation-container').classList.add('hidden');
                document.getElementById('btn-random-explorer').classList.add('hidden');
                
                // Reset quiz specific UI
                const btnSubmit = document.getElementById('btn-submit-quiz');
                btnSubmit.innerText = "Submit Answer";
                btnSubmit.className = "w-full mt-6 px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold transition-all shadow-sm block";
                btnSubmit.disabled = false;
                
                drawTable('quiz');
                quizPoints = [];
                quizState.isSubmitted = false;
                
                // Auto focus first input
                setTimeout(() => {
                    const firstInput = document.getElementById('input-y-1');
                    if (firstInput) firstInput.focus();
                }, 100);
            }
        }

        // --- STREAMING_CHUNK:Explorer Step Logic ---
        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateStep();
            }
        }

        function nextStep() {
            if (currentStep < 3) {
                currentStep++;
                updateStep();
            }
        }

        function updateStep() {
            // Cancel any ongoing staggered animations if the user navigates quickly
            explorerTimeouts.forEach(t => clearTimeout(t));
            explorerTimeouts = [];

            document.getElementById('step-indicator').innerText = currentStep;
            
            // Toggle button states
            document.getElementById('btn-prev-step').disabled = (currentStep === 1);
            document.getElementById('btn-next-step').disabled = (currentStep === 3);

            pointsGroup.selectAll("*").remove();
            lineGroup.selectAll("*").remove();
            
            const calcContainer = document.getElementById('calculation-container');
            const calcList = document.getElementById('calculation-list');

            if (currentStep >= 3) {
                // Ensure table is fully shown if skipped to step 3
                tableData.forEach(d => d.visible = true);
            }

            if (currentStep === 1) {
                tableData.forEach(d => d.visible = false);
                calcContainer.classList.add('hidden');
                drawTable('explorer');
            } 
            else if (currentStep === 2) {
                calcContainer.classList.remove('hidden');
                calcList.innerHTML = '';
                
                tableData.forEach((row, i) => {
                    let li = document.createElement('li');
                    li.id = `calc-step-${i}`;
                    li.className = "opacity-0 transition-opacity duration-500";
                    li.innerHTML = getCalculationString(eq.a, eq.b, eq.c, row.x, row.y);
                    calcList.appendChild(li);
                });
                if(window.MathJax) MathJax.typesetPromise([calcList]);

                tableData[0].visible = true;
                drawTable('explorer');
                document.getElementById('calc-step-0').classList.remove('opacity-0');
                
                // Staggered reveal
                explorerTimeouts.push(setTimeout(() => { 
                    if(currentStep === 2) { 
                        tableData[1].visible = true; 
                        drawTable('explorer'); 
                        document.getElementById('calc-step-1').classList.remove('opacity-0');
                    }
                }, 1000));
                explorerTimeouts.push(setTimeout(() => { 
                    if(currentStep === 2) { 
                        tableData[2].visible = true; 
                        drawTable('explorer'); 
                        document.getElementById('calc-step-2').classList.remove('opacity-0');
                    }
                }, 2000));
            }
            if (currentStep === 3) {
                calcContainer.classList.remove('hidden');
                if (calcList.innerHTML === '') {
                    // Populate if user skipped step 2 directly
                    tableData.forEach((row, i) => {
                        let li = document.createElement('li');
                        li.className = "";
                        li.innerHTML = getCalculationString(eq.a, eq.b, eq.c, row.x, row.y);
                        calcList.appendChild(li);
                    });
                    if (window.MathJax) MathJax.typesetPromise([calcList]);
                } else {
                    calcList.childNodes.forEach(li => { if(li.classList) li.classList.remove('opacity-0') });
                }

                drawTable('explorer');
                
                // Plot Points
                const pts = pointsGroup.selectAll("g.point-group").data(tableData).enter().append("g").attr("class", "point-group");
                
                pts.append("circle")
                    .attr("cx", d => xScale(d.x))
                    .attr("cy", d => yScale(d.y))
                    .attr("r", 0)
                    .attr("fill", "#2563eb")
                    .transition().duration(500).delay((d,i) => i*300)
                    .attr("r", 6);
                
                const labels = pts.append("foreignObject")
                    .attr("x", d => xScale(d.x) + 10)
                    .attr("y", d => yScale(d.y) - 20)
                    .attr("width", 1)
                    .attr("height", 1)
                    .style("overflow", "visible")
                    .append("xhtml:div")
                    .style("font-weight", "600")
                    .style("color", "#0f172a")
                    .style("text-shadow", "2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 2px 0 #fff, 2px 0 0 #fff, 0 -2px 0 #fff, -2px 0 0 #fff")
                    .style("white-space", "nowrap")
                    .style("opacity", 0)
                    .html(d => `\\((${d.x}, ${d.y})\\)`);
                
                // Typeset LaTeX immediately while the element is still invisible (opacity 0)
                if (window.MathJax) MathJax.typesetPromise([pointsGroup.node()]);

                // Fade in the already-typeset LaTeX
                labels.transition().duration(500).delay((d,i) => i*300 + 300)
                    .style("opacity", 1);

                // Draw Line
                explorerTimeouts.push(setTimeout(() => {
                    if(currentStep === 3) drawLine("#2563eb");
                }, 1500));
            }
        }

        // --- STREAMING_CHUNK:Table Drawing ---
        function drawTable(mode) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            const trX = document.createElement('tr');
            trX.className = "bg-white";
            const thX = document.createElement('th');
            thX.className = "py-3 px-4 bg-slate-50 font-semibold text-slate-700 w-1/4 border-r border-slate-200";
            thX.innerHTML = "\\(x\\)";
            trX.appendChild(thX);

            const trY = document.createElement('tr');
            trY.className = "bg-white";
            const thY = document.createElement('th');
            thY.className = "py-3 px-4 bg-slate-50 font-semibold text-slate-700 w-1/4 border-r border-slate-200";
            thY.innerHTML = "\\(y\\)";
            trY.appendChild(thY);

            if (mode === 'explorer') {
                tableData.forEach((row, i) => {
                    const tdX = document.createElement('td');
                    tdX.className = "py-3 px-2 sm:px-4 border-r border-slate-200 last:border-r-0 w-1/4";
                    const tdY = document.createElement('td');
                    tdY.className = "py-3 px-2 sm:px-4 border-r border-slate-200 last:border-r-0 w-1/4";
                    
                    tdX.innerHTML = `\\(${row.visible ? row.x : '?'}\\)`;
                    tdY.innerHTML = `\\(${row.visible ? row.y : '?'}\\)`;
                    
                    if (!row.visible) {
                        tdX.classList.add('text-slate-400', 'bg-slate-50/50');
                        tdY.classList.add('text-slate-400', 'bg-slate-50/50');
                    }
                    trX.appendChild(tdX);
                    trY.appendChild(tdY);
                });
            } else if (mode === 'quiz') {
                tableData.forEach((row, i) => {
                    const tdX = document.createElement('td');
                    tdX.className = "py-3 px-2 sm:px-4 border-r border-slate-200 last:border-r-0 w-1/4";
                    const tdY = document.createElement('td');
                    tdY.className = "py-3 px-2 sm:px-4 border-r border-slate-200 last:border-r-0 w-1/4";
                    
                    if (row.type === 'full') {
                        tdX.innerHTML = `\\(${row.x}\\)`;
                        tdY.innerHTML = `\\(${row.y}\\)`;
                    } else if (row.type === 'miss_y') {
                        tdX.innerHTML = `\\(${row.x}\\)`;
                        tdY.innerHTML = `
                            <div class="flex flex-col items-center">
                                <input type="number" id="input-y-${i}" class="w-14 sm:w-16 text-center border border-slate-300 rounded p-1 outline-none focus:border-blue-500" onkeydown="handleInputEnter(event, 'input-x-2')">
                                <span id="feedback-y-${i}" class="text-xs font-bold text-red-600 mt-1 hidden"></span>
                            </div>`;
                    } else if (row.type === 'miss_x') {
                        tdX.innerHTML = `
                            <div class="flex flex-col items-center">
                                <input type="number" id="input-x-${i}" class="w-14 sm:w-16 text-center border border-slate-300 rounded p-1 outline-none focus:border-blue-500" onkeydown="handleInputEnter(event, null)">
                                <span id="feedback-x-${i}" class="text-xs font-bold text-red-600 mt-1 hidden"></span>
                            </div>`;
                        tdY.innerHTML = `\\(${row.y}\\)`;
                    }
                    trX.appendChild(tdX);
                    trY.appendChild(tdY);
                });
            }
            
            tbody.appendChild(trX);
            tbody.appendChild(trY);
            if (window.MathJax) MathJax.typesetPromise([tbody]);
        }

        function handleInputEnter(e, nextId) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (nextId && document.getElementById(nextId)) {
                    document.getElementById(nextId).focus();
                } else {
                    submitQuiz();
                }
            }
        }

        // --- STREAMING_CHUNK:Interactive Graph Logic (Quiz) ---
        function handleGraphClick(event) {
            if (currentMode !== 'quiz' || quizState.isSubmitted) return;
            
            // Allow max 3 points
            if (quizPoints.length >= 3) return;

            const [px, py] = d3.pointer(event);
            const x = Math.round(xScale.invert(px));
            const y = Math.round(yScale.invert(py));

            // Prevent stacking points exactly
            if (quizPoints.some(p => p.x === x && p.y === y)) return;

            quizPoints.push({ id: Date.now(), x: x, y: y });
            updateQuizGraph();
        }

        function updateQuizGraph() {
            // Bind data
            const points = pointsGroup.selectAll("g.point-group")
                .data(quizPoints, d => d.id);

            // Exit
            points.exit().remove();

            // Enter
            const enterG = points.enter().append("g")
                .attr("class", "point-group point")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended)
                )
                // Right click to remove point
                .on("contextmenu", function(e, d) {
                    e.preventDefault();
                    if(quizState.isSubmitted) return;
                    quizPoints = quizPoints.filter(p => p.id !== d.id);
                    updateQuizGraph();
                });

            enterG.append("circle")
                .attr("r", 7)
                .attr("fill", "#f59e0b")
                .attr("stroke", "#fff")
                .attr("stroke-width", 2);

            enterG.append("foreignObject")
                .attr("x", 12)
                .attr("y", -25)
                .attr("width", 1)
                .attr("height", 1)
                .style("overflow", "visible")
                .style("pointer-events", "none")
                .append("xhtml:div")
                .attr("class", "point-label font-bold")
                .style("font-size", "14px")
                .style("color", "#0f172a")
                .style("text-shadow", "2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 2px 0 #fff, 2px 0 0 #fff, 0 -2px 0 #fff, -2px 0 0 #fff")
                .style("white-space", "nowrap");

            // Update all positions
            const allG = enterG.merge(points);
            allG.attr("transform", d => `translate(${xScale(d.x)},${yScale(d.y)})`);
            
            // Set initial mathjax label
            allG.select(".point-label").each(function(d) {
                this.innerHTML = `\\((${d.x}, ${d.y})\\)`;
            });
            
            if(window.MathJax) MathJax.typesetPromise([pointsGroup.node()]);

            // Draw Dynamic Straight Line between first 2 points
            drawDynamicLine();
        }

        // Dragging Logic mapping absolute pointer to grid
        function dragstarted(event, d) {
            if (quizState.isSubmitted) return;
            d3.select(this).select("circle").attr("r", 9).attr("fill", "#d97706");
        }

        function dragged(event, d) {
            if (quizState.isSubmitted) return;
            
            // Use pointer to avoid relative drift
            const [px, py] = d3.pointer(event, g.node());
            d.x = Math.round(xScale.invert(px));
            d.y = Math.round(yScale.invert(py));

            // Clamp to domain
            d.x = Math.max(-10, Math.min(10, d.x));
            d.y = Math.max(-10, Math.min(10, d.y));

            const group = d3.select(this);
            group.attr("transform", `translate(${xScale(d.x)},${yScale(d.y)})`);
            
            // Fast text update during drag (without re-typesetting latex for performance)
            if(window.MathJax) MathJax.typesetClear([group.select(".point-label").node()]);
            group.select(".point-label").html(`(${d.x}, ${d.y})`);
            
            drawDynamicLine();
        }

        function dragended(event, d) {
            if (quizState.isSubmitted) return;
            const group = d3.select(this);
            group.select("circle").attr("r", 7).attr("fill", "#f59e0b");
            
            // Re-typeset Latex securely
            group.select(".point-label").html(`\\((${d.x}, ${d.y})\\)`);
            if (window.MathJax) MathJax.typesetPromise([group.select(".point-label").node()]);
        }

        function drawDynamicLine() {
            dynamicLineGroup.selectAll("*").remove();
            if (quizPoints.length >= 2) {
                const p1 = quizPoints[0];
                const p2 = quizPoints[1];
                
                // If points are on same spot, can't draw line
                if(p1.x === p2.x && p1.y === p2.y) return;

                const m = (p2.y - p1.y) / (p2.x - p1.x);
                const cy = p1.y - m * p1.x;

                let yLeft = m * (-10) + cy;
                let yRight = m * (10) + cy;
                let xLeft = -10, xRight = 10;

                // Handle vertical line case
                if (!isFinite(m)) {
                    xLeft = p1.x; xRight = p1.x;
                    yLeft = 10; yRight = -10;
                }

                dynamicLineGroup.append("line")
                    .attr("x1", xScale(xLeft))
                    .attr("y1", yScale(yLeft))
                    .attr("x2", xScale(xRight))
                    .attr("y2", yScale(yRight))
                    .attr("stroke", "#a855f7") // Purple dashed guide
                    .attr("stroke-width", 2)
                    .attr("stroke-dasharray", "5,5")
                    .attr("opacity", 0.6);
            }
        }

        // --- STREAMING_CHUNK:Final Line & Submissions ---
        function drawLine(color) {
            let m = -eq.a / eq.b;
            let cy = -eq.c / eq.b;

            let yLeft = m * (-10) + cy;
            let yRight = m * (10) + cy;

            const path = lineGroup.append("line")
                .attr("x1", xScale(-10))
                .attr("y1", yScale(yLeft))
                .attr("x2", xScale(10))
                .attr("y2", yScale(yRight))
                .attr("stroke", color)
                .attr("stroke-width", 3);

            // Animate line drawing
            const length = path.node().getTotalLength();
            path.attr("stroke-dasharray", length)
                .attr("stroke-dashoffset", length)
                .transition()
                .duration(1000)
                .ease(d3.easeLinear)
                .attr("stroke-dashoffset", 0);

            // Intelligent Label Placement
            // Find an x coordinate (-8 to 8) that maximizes distance to plotted points
            let bestX = 0;
            let maxMinDist = -1;
            
            let pts = currentMode === 'quiz' ? quizPoints : tableData;

            for (let testX = -8; testX <= 8; testX += 2) {
                let testY = m * testX + cy;
                if (testY < -9 || testY > 9) continue;
                
                let minDist = Infinity;
                pts.forEach(p => {
                    let d = Math.sqrt(Math.pow(p.x - testX, 2) + Math.pow(p.y - testY, 2));
                    if (d < minDist) minDist = d;
                });
                
                if (minDist > maxMinDist) {
                    maxMinDist = minDist;
                    bestX = testX;
                }
            }

            let labelY = m * bestX + cy;

            setTimeout(() => {
                const labelFO = lineGroup.append("foreignObject")
                    .attr("x", xScale(bestX) + 10)
                    .attr("y", yScale(labelY) - 20)
                    .attr("width", 1)
                    .attr("height", 1)
                    .style("overflow", "visible");

                const labelDiv = labelFO.append("xhtml:div")
                    .style("opacity", 0)
                    .style("font-weight", "bold")
                    .style("color", color)
                    .style("text-shadow", "2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 2px 0 #fff, 2px 0 0 #fff, 0 -2px 0 #fff, -2px 0 0 #fff")
                    .style("white-space", "nowrap")
                    .html(formatLatexEq(eq.a, eq.b, eq.c, true)); // Requesting inline latex

                labelDiv.transition().duration(500).style("opacity", 1);
                if (window.MathJax) MathJax.typesetPromise([labelDiv.node()]);
            }, 1000);
        }

        function submitQuiz() {
            if (quizState.isSubmitted) {
                // If clicking when already submitted and wrong, skip to next question
                startQuiz();
                return;
            }

            const btnSubmit = document.getElementById('btn-submit-quiz');
            btnSubmit.disabled = true;
            quizState.isSubmitted = true;

            // 1. Verify Table Inputs
            let isTableCorrect = true;
            const inputY = document.getElementById('input-y-1');
            const inputX = document.getElementById('input-x-2');

            if (inputY) {
                let valY = parseFloat(inputY.value);
                if (valY !== quizTargetTable[1].y) {
                    isTableCorrect = false;
                    inputY.classList.add('input-error');
                    const fbY = document.getElementById('feedback-y-1');
                    if(fbY) { 
                        fbY.innerText = `Ans: ${quizTargetTable[1].y}`; 
                        fbY.classList.remove('hidden'); 
                    }
                } else {
                    inputY.classList.add('input-success');
                }
            }
            if (inputX) {
                let valX = parseFloat(inputX.value);
                if (valX !== quizTargetTable[2].x) {
                    isTableCorrect = false;
                    inputX.classList.add('input-error');
                    const fbX = document.getElementById('feedback-x-2');
                    if(fbX) { 
                        fbX.innerText = `Ans: ${quizTargetTable[2].x}`; 
                        fbX.classList.remove('hidden'); 
                    }
                } else {
                    inputX.classList.add('input-success');
                }
            }

            // 2. Verify Graph Points
            let isGraphCorrect = true;
            if (quizPoints.length !== 3) {
                isGraphCorrect = false;
            } else {
                // Check if the 3 user points perfectly match the 3 target points (order agnostic)
                let matched = [false, false, false];
                quizPoints.forEach(up => {
                    let matchIndex = quizTargetTable.findIndex((tp, i) => !matched[i] && tp.x === up.x && tp.y === up.y);
                    if (matchIndex !== -1) matched[matchIndex] = true;
                });
                if (matched.includes(false)) isGraphCorrect = false;
            }

            const isAllCorrect = isTableCorrect && isGraphCorrect;

            // 3. Update Score & GAS
            quizState.attempted++;
            if (isAllCorrect) quizState.correct++;
            
            document.getElementById('score-correct').innerText = quizState.correct;
            document.getElementById('score-attempted').innerText = quizState.attempted;
            
            sendDataToGAS();

            // 4. Visual Feedback
            // Remove dynamic line and freeze points
            dynamicLineGroup.selectAll("*").remove();
            pointsGroup.selectAll(".point-group").on(".drag", null);
            
            if (isAllCorrect) {
                drawLine("#10b981"); // Green line
                btnSubmit.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                btnSubmit.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
                btnSubmit.innerText = "Correct! Next question in 3s...";
                setTimeout(() => { startQuiz(); }, 3000);
            } else {
                drawLine("#ef4444"); // Red line showing correct answer
                btnSubmit.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                btnSubmit.classList.add('bg-red-500', 'hover:bg-red-600');
                btnSubmit.innerText = "Incorrect. Next Question \u2192";
                btnSubmit.disabled = false; // Allow manual skip
                
                // Draw correct points as visual feedback
                uiGroup.selectAll("circle.correct-ans")
                    .data(quizTargetTable).enter()
                    .append("circle")
                    .attr("class", "correct-ans")
                    .attr("cx", d => xScale(d.x))
                    .attr("cy", d => yScale(d.y))
                    .attr("r", 12)
                    .attr("fill", "none")
                    .attr("stroke", "#ef4444")
                    .attr("stroke-width", 3)
                    .attr("stroke-dasharray", "4,2");
            }
        }

        function startQuiz() {
            generateEquation('quiz');
            renderMode();
        }

        // Run Init
        window.onload = init;
    </script>
